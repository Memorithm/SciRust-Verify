schema_version: 1
kind: memorithm_ml_maturity_program
status: active
last_updated: "2026-09-05"
repository: Memorithm/SciRust-Verify
objective: >-
  Raise ML evidence and verification maturity to 5/5 by making model quality,
  numerical parity, determinism, performance, memory, hardware scope and
  cross-host reproducibility first-class evidence without confusing empirical
  verification with formal proof.
score_policy:
  five_of_five_requires:
    - versioned_ML_evidence_schemas
    - producer_semantics_preserved_not_flattened
    - raw_measurements_and_environment_identity_retained
    - independent_reapplication_of_thresholds_where_possible
    - explicit_scope_and_limitations_in_every_verdict
    - exact_head_required_CI_green
  forbidden:
    - universalizing_single_host_or_single_GPU_evidence
    - accepting_self_reported_PASS_without_raw_evidence
    - combining_quality_latency_and_memory_into_an_opaque_score_without_declared_policy
verified_slices:
  - id: FORGE_SOUP_source_preserving_evidence_ingestion_v1
    status: complete
    pull_request: 29
    final_exact_head: eb2845a8d0ee33c71d0804ac47b34fa663bd3ad0
    merge_commit: 89f485633e842017781778eb1568b5306e0a5570
    required_CI: CI_92_success_on_final_exact_head
    source_identities:
      forge_domain_merge: 1385c71a541419f15a558a5e94bc8a4a60567a4a
      forge_runner_merge: 9e1f3fc568c176f401735c121780d9fbe6834f5d
      hub_edge_merge: 074cf2c6e00a0b142fe46d1558c8b32df9228859
      soup_qualified_commit: 05b646523727925990530667e7012ede50bd30b2
    scope: >-
      SciRust-Verify can ingest the qualified Hub → Forge → SOUP report and
      evidence tar, preserve raw benchmark/timing measurements and environment
      fingerprints, and revalidate candidate recipe/config/dataset/generation
      identity and final-front measurement coverage. Search scores, Pareto
      membership and SOUP dry-run success remain observations rather than
      self-authorizing verification verdicts.
    limits:
      - source_identity_origin_still_requires_trusted_Hub_provenance
      - no_cross_host_comparability_is_established
      - no_hardware_portability_is_established
      - no_hostile_code_isolation_is_established
      - no_model_quality_claim_is_independently_verified_by_this_adapter
      - this_slice_does_not_complete_VML0_VML1_VML2_VML3_or_VML4
  - id: NNIS_NNML1_exact_byte_parity_binding_v1
    status: complete
    pull_request: 33
    final_exact_head: a120c54ed05b058d9347691d0036eaaaa831df41
    merge_commit: 593692aea76b90e50899e733344ffa4cf61ba380
    required_CI: CI_110_success_on_final_exact_head_including_dogfood
    source_identities:
      nnis_contract: nnis.nnml1.parity-validation@1.0.0
      nnis_pull_request: 114
      nnis_final_exact_head: c74b6b04c45e320c86cdd973b31f49f43c720681
      nnis_merge_commit: 0ae4b0d4659c8de9b8a8322ed6ab7f8e110b53f2
      hub_pull_request: 37
      hub_final_exact_head: 9e95e7d6a141b3f06bfc9effac51007bdfe9b1c2
      hub_merge_commit: 0e484d9f9903fe0f0fcb7111e0191dfb14d958b4
    scope: >-
      SciRust-Verify independently SHA-256 binds the exact original NNIS NNML1
      parity-evidence bytes to the qualified NNIS validation result, validates
      the versioned validation envelope and cross-artifact execution commit, and
      preserves checkpoint specs, parity levels, reference runtimes and execution
      backends as producer-owned observations. The exact NNIS validation result is
      retained as a content-addressed dossier attachment. The VERIFIED claim is
      limited to exact-byte binding and validation-envelope conformance.
    limits:
      - NNIS_checkpoint_tokenizer_greedy_logit_same_head_and_promotion_semantics_are_not_reimplemented
      - no_new_CUDA_model_or_reference_runtime_execution_is_performed
      - no_model_quality_serving_performance_general_model_family_or_promotion_claim_is_established
      - no_cross_host_or_hardware_portability_claim_is_established
      - origin_authentication_of_the_NNIS_validation_result_requires_trusted_Hub_or_execution_provenance
      - this_slice_is_a_narrow_VML0_style_evidence_envelope_contribution_and_does_not_complete_VML1_VML2_VML3_or_VML4
priority_program:
  - id: VML0
    name: ML evidence envelope
    priority: P0
    status: active_with_qualified_NNIS_parity_binding_reference
    goals:
      - define_versioned_model_identity_config_tokenizer_weights_dataset_and_checkpoint_refs
      - distinguish_numerical_quality_performance_memory_energy_determinism_and_correctness_claims
      - bind_exact_source_commit_binary_toolchain_driver_device_and_runtime_versions
  - id: VML1
    name: Benchmark verification
    priority: P0
    goals:
      - ingest_latency_distributions_throughput_memory_and_compile_or_load_time_samples
      - verify_sample_counts_warmups_dimensions_and_timing_method_metadata
      - reject_non_finite_or_structurally_incomplete_measurements
      - preserve_microbenchmark_vs_end_to_end_scope
  - id: VML2
    name: Model quality verification
    priority: P0
    goals:
      - ingest_logits_perplexity_accuracy_task_metrics_or_other_declared_quality_observations
      - independently_reapply_tolerances_or_metric_reductions_when_raw_data_is_available
      - bind_baseline_and_candidate_to_same_model_dataset_prompt_and_decode_policy
  - id: VML3
    name: Cross host and distributed evidence
    priority: P0
    goals:
      - aggregate_multiple_host_GPU_architecture_and_thread_count_runs_without_claim_inflation
      - distinguish_bit_exact_tolerance_equivalent_statistically_equivalent_and_not_comparable
      - preserve_rank_worker_and_collective_failure_evidence_for_distributed_training
  - id: VML4
    name: Signed and portable evidence
    priority: P1
    goals:
      - integrate_detached_signatures_or_attestations_without_making_signature_equal_truth
      - interoperate_with_SciCapsule_and_Hub_artifact_identity
      - support_remote_CI_evidence_ingestion_with_explicit_trust_policy
completion_definition: >-
  SciRust-Verify is 5/5 for ML when every claimed maturity gain can be traced to
  exact model/workload/hardware evidence, thresholds are independently evaluated
  where possible, multi-host scope is represented honestly, and reports make
  unsupported generalization impossible by construction.
