schema_version = 1

[artifact]
name = "deterministic-project"

[verification]
profile = "basic"
timeout_secs = 180

[cargo]
enabled = true
fmt = false
clippy = false
check = false
build = true
test = false
doc = false
deny = "off"

[determinism]
enabled = true
runs = 2
program = ["cargo", "run", "--quiet", "--bin", "det-app"]
mode = "structured"
# Exercise the thread-variation path: the engine sets SCI_THREADS per level
# and includes those runs in the fingerprint comparison.
thread_levels = [1, 4]
thread_env = "SCI_THREADS"

[claims]
cross_process_deterministic = "required"
