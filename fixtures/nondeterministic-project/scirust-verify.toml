schema_version = 1

[artifact]
name = "nondeterministic-project"

[verification]
profile = "basic"
timeout_secs = 180

[cargo]
enabled = true
fmt = false
clippy = false
check = false
build = true
test = false
doc = false
deny = "off"

[determinism]
enabled = true
runs = 3
program = ["cargo", "run", "--quiet", "--bin", "non-det-app"]
mode = "structured"

[claims]
cross_process_deterministic = "required"
