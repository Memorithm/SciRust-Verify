name: Validate V0.3 scope aggregation

on:
  push:
    branches: [feat/cross-run-scope-aggregation]

permissions:
  contents: write

jobs:
  apply-validate-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cross-run-scope-aggregation
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply V0.3 patch
        run: python3 .github/apply_v03_scope_aggregation.py

      - name: Format product changes
        run: cargo fmt --all

      - name: Commit product patch locally for clean-source tests
        run: |
          set -euo pipefail
          git config user.name "SciRust Verify V0.3 Bot"
          git config user.email "actions@users.noreply.github.com"
          git add Cargo.toml Cargo.lock README.md docs crates || true
          git diff --cached --check
          git commit -m "feat: certify cross-run verification scope"
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Check locked
        run: cargo check --workspace --all-targets --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --all-targets --locked

      - name: Documentation
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --locked

      - name: Aggregate dogfood
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          store="$tmp/.scirust-verify"
          cargo run -p scirust-verify-cli -- verify fixtures/passing-project --output "$store"
          cargo run -p scirust-verify-cli -- verify fixtures/passing-project --output "$store"
          mapfile -t ids < <(find "$store/runs" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort)
          test "${#ids[@]}" -ge 2

          cargo run -p scirust-verify-cli -- --json aggregate tests_pass "${ids[0]}" "${ids[1]}" --project "$tmp" --require-scope --min-platforms 1 > "$tmp/aggregate.json"
          python3 - "$tmp/aggregate.json" <<'PY'
          import json, sys
          doc = json.load(open(sys.argv[1]))
          assert doc["all_verified"] is True
          assert doc["scope_assessment"]["source_consistency"] == "verified"
          assert doc["scope_assessment"]["scope_certified"] is True
          assert doc["scope_assessment"]["distinct_platforms"] >= 1
          assert all(r["integrity_verified"] for r in doc["runs"])
          PY

          set +e
          cargo run -p scirust-verify-cli -- --json aggregate tests_pass "${ids[0]}" "${ids[1]}" --project "$tmp" --require-scope --min-platforms 2 > "$tmp/multi.json"
          code=$?
          set -e
          test "$code" -eq 1
          python3 - "$tmp/multi.json" <<'PY'
          import json, sys
          doc = json.load(open(sys.argv[1]))
          assert doc["scope_assessment"]["scope_certified"] is False
          assert doc["scope_assessment"]["minimum_platforms"] == 2
          PY

          python3 - "${store}/runs/${ids[0]}/evaluations.json" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          s = p.read_text()
          if '"verified"' not in s:
              raise SystemExit("expected verified evaluation")
          p.write_text(s.replace('"verified"', '"failed"', 1))
          PY
          set +e
          cargo run -p scirust-verify-cli -- --json aggregate tests_pass "${ids[0]}" "${ids[1]}" --project "$tmp" > "$tmp/corrupt.json" 2> "$tmp/corrupt.err"
          code=$?
          set -e
          test "$code" -eq 1
          grep -qi integrity "$tmp/corrupt.err"

      - name: Remove staging files and push validated branch
        run: |
          set -euo pipefail
          git rm .github/apply_v03_scope_aggregation.py .github/workflows/apply-v03-scope-aggregation.yml
          git commit -m "chore: remove V0.3 staging workflow"
          git push origin HEAD:feat/cross-run-scope-aggregation
