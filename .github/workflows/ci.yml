name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: never
  RUSTFLAGS: -D warnings

jobs:
  verify:
    name: fmt / check / clippy / test / doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry & build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Check (all targets, locked)
        run: cargo check --workspace --all-targets --locked

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Unit & integration tests
        run: cargo test --workspace --all-targets --locked

      - name: Documentation (deny warnings)
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --locked

  self-verification:
    name: Dogfood — scirust-verify verify .
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry & build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build CLI
        run: cargo build --release --locked -p scirust-verify-cli

      - name: Verify this repository with itself
        run: ./target/release/scirust-verify verify .

      - name: Verify passing fixture end-to-end
        run: ./target/release/scirust-verify verify fixtures/passing-project

      - name: Failing fixture must exit 1 but seal a dossier
        run: |
          set +e
          ./target/release/scirust-verify verify fixtures/failing-tests
          code=$?
          set -e
          test "$code" -eq 1
          latest=$(ls -d fixtures/failing-tests/.scirust-verify/runs/run-* | sort | tail -1)
          test -f "$latest/bundle.json"
          test -f "$latest/report.json"

  containment-dogfood:
    name: Dogfood — bubblewrap containment
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry & build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap

      - name: Permit user namespaces on disposable runner
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          if [ -e /proc/sys/kernel/unprivileged_userns_clone ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          test "$(cat /proc/sys/user/max_user_namespaces)" -gt 0
          bwrap --unshare-user --unshare-net --ro-bind / / -- /bin/true

      - name: Build CLI
        run: cargo build --release --locked -p scirust-verify-cli

      - name: Verify passing fixture inside bubblewrap
        run: ./target/release/scirust-verify-contain fixtures/passing-project

      - name: Validate sealed containment provenance
        run: |
          latest=$(ls -d fixtures/passing-project/.scirust-verify/runs/run-* | sort | tail -1)
          python3 - "$latest" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          run = pathlib.Path(sys.argv[1])
          environment_bytes = (run / "environment.json").read_bytes()
          environment = json.loads(environment_bytes)
          boundary = environment.get("execution_boundary")
          assert boundary == {
              "mechanism": "bubblewrap",
              "profile": "bubblewrap-v1",
              "assertion_scope": "producer_declared_not_attested",
          }, boundary

          bundle = json.loads((run / "bundle.json").read_text())
          expected = hashlib.sha256(environment_bytes).hexdigest()
          assert bundle["files"]["environment.json"] == expected
          PY

  signature-trust-dogfood:
    name: Dogfood — signature trust policy
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry & build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build CLI
        run: cargo build --release --locked -p scirust-verify-cli

      - name: Produce and sign a real dossier
        run: |
          ./target/release/scirust-verify verify fixtures/passing-project
          run_dir=$(ls -d fixtures/passing-project/.scirust-verify/runs/run-* | sort | tail -1)
          run_id=$(basename "$run_dir")
          ./target/release/scirust-verify keygen \
            --private-key /tmp/scirust-verify-private.json \
            --public-key /tmp/scirust-verify-public.json
          ./target/release/scirust-verify sign "$run_id" \
            --private-key /tmp/scirust-verify-private.json \
            --project fixtures/passing-project
          echo "RUN_ID=$run_id" >> "$GITHUB_ENV"

      - name: Accept explicitly allowed signing fingerprint
        run: |
          python3 - <<'PY'
          import json

          public = json.load(open('/tmp/scirust-verify-public.json'))
          policy = {
              'schema_version': 1,
              'allowed_fingerprints_sha256': [public['fingerprint_sha256']],
          }
          with open('/tmp/signature-trust-allow.json', 'w') as f:
              json.dump(policy, f, sort_keys=True)
          PY
          key_id=$(python3 -c 'import json; print(json.load(open("/tmp/scirust-verify-public.json"))["key_id"])')
          signature="fixtures/passing-project/.scirust-verify/signatures/$RUN_ID/$key_id.json"
          test -f "$signature"
          ./target/release/scirust-verify-signature-policy "$RUN_ID" \
            --signature "$signature" \
            --public-key /tmp/scirust-verify-public.json \
            --policy /tmp/signature-trust-allow.json \
            --project fixtures/passing-project \
            --json

      - name: Explicit revocation must fail closed
        run: |
          python3 - <<'PY'
          import json

          public = json.load(open('/tmp/scirust-verify-public.json'))
          fingerprint = public['fingerprint_sha256']
          policy = {
              'schema_version': 1,
              'allowed_fingerprints_sha256': [fingerprint],
              'revoked_fingerprints_sha256': [fingerprint],
          }
          with open('/tmp/signature-trust-revoked.json', 'w') as f:
              json.dump(policy, f, sort_keys=True)
          PY
          key_id=$(python3 -c 'import json; print(json.load(open("/tmp/scirust-verify-public.json"))["key_id"])')
          signature="fixtures/passing-project/.scirust-verify/signatures/$RUN_ID/$key_id.json"
          set +e
          ./target/release/scirust-verify-signature-policy "$RUN_ID" \
            --signature "$signature" \
            --public-key /tmp/scirust-verify-public.json \
            --policy /tmp/signature-trust-revoked.json \
            --project fixtures/passing-project \
            --json
          code=$?
          set -e
          test "$code" -eq 1
