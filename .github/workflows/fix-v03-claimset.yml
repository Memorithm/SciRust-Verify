name: Validate V0.3 claim-set hardening

on:
  push:
    branches: [feat/cross-run-scope-aggregation]

permissions:
  contents: write

jobs:
  harden-validate-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cross-run-scope-aggregation
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply claim-set hardening
        run: python3 .github/fix_v03_claimset.py

      - name: Format
        run: cargo fmt --all

      - name: Commit product patch locally
        run: |
          set -euo pipefail
          git config user.name "SciRust Verify V0.3 Bot"
          git config user.email "actions@users.noreply.github.com"
          git add crates
          git diff --cached --check
          git commit -m "fix: require identical cross-run claim definitions"

      - name: Formatting check
        run: cargo fmt --all -- --check

      - name: Check locked
        run: cargo check --workspace --all-targets --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --all-targets --locked

      - name: Documentation
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --locked

      - name: Scope aggregation dogfood
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          store="$tmp/.scirust-verify"
          cargo run -p scirust-verify-cli -- verify fixtures/passing-project --output "$store"
          cargo run -p scirust-verify-cli -- verify fixtures/passing-project --output "$store"
          mapfile -t ids < <(find "$store/runs" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort)
          cargo run -p scirust-verify-cli -- --json aggregate tests_pass "${ids[0]}" "${ids[1]}" --project "$tmp" --require-scope --min-platforms 1 > "$tmp/aggregate.json"
          python3 - "$tmp/aggregate.json" <<'PY'
          import json, sys
          doc = json.load(open(sys.argv[1]))
          assert doc["all_runs_covered"] is True
          assert doc["all_verified"] is True
          assert doc["scope_assessment"]["claim_definitions_consistent"] is True
          assert doc["scope_assessment"]["scope_certified"] is True
          PY

      - name: Remove staging files and push validated branch
        run: |
          set -euo pipefail
          git rm .github/fix_v03_claimset.py .github/workflows/fix-v03-claimset.yml
          git commit -m "chore: remove V0.3 claim-set staging"
          git push origin HEAD:feat/cross-run-scope-aggregation
