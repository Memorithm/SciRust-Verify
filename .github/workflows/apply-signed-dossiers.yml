name: Validate signed evidence dossiers

on:
  push:
    branches: [feat/signed-evidence-dossiers]

permissions:
  contents: write

jobs:
  patch-validate-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/signed-evidence-dossiers
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply integration patch
        run: python3 .github/apply_signed_dossiers.py

      - name: Refresh lockfile for signature dependencies
        run: cargo check --workspace --all-targets

      - name: Format
        run: cargo fmt --all && cargo fmt --all -- --check

      - name: Check locked
        run: cargo check --workspace --all-targets --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --all-targets --locked

      - name: Documentation
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --locked

      - name: Signature dogfood
        shell: bash
        run: |
          set -euo pipefail
          root="$(pwd)"
          tmp="$(mktemp -d)"
          cargo run -p scirust-verify-cli -- verify . --output "$tmp/.scirust-verify"
          run_id="$(find "$tmp/.scirust-verify/runs" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | tail -1)"
          cargo run -p scirust-verify-cli -- keygen --private-key "$tmp/private.json" --public-key "$tmp/public.json"
          cargo run -p scirust-verify-cli -- sign "$run_id" --private-key "$tmp/private.json" --project "$tmp"
          cargo run -p scirust-verify-cli -- --json verify-signature "$run_id" --public-key "$tmp/public.json" --project "$tmp" | tee "$tmp/verification.json"
          python3 - "$tmp/verification.json" <<'PY'
          import json, sys
          doc = json.load(open(sys.argv[1]))
          assert doc["cryptographically_valid"] is True
          assert "signer identity" in doc["trust_scope"]
          PY

      - name: Commit validated implementation
        run: |
          set -euo pipefail
          git config user.name "SciRust Verify V0.2 Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/apply_signed_dossiers.py .github/workflows/apply-signed-dossiers.yml
          git add -A
          git diff --cached --check
          git commit -m "feat: add signed evidence dossiers"
          git push origin HEAD:feat/signed-evidence-dossiers
