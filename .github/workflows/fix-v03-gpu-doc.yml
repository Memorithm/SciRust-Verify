name: Validate V0.3 GPU scope docs

on:
  push:
    branches: [feat/cross-run-scope-aggregation]

permissions:
  contents: write

jobs:
  validate-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cross-run-scope-aggregation
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply documentation fix
        run: python3 .github/fix_v03_gpu_doc.py

      - name: Commit product patch locally
        run: |
          set -euo pipefail
          git config user.name "SciRust Verify V0.3 Bot"
          git config user.email "actions@users.noreply.github.com"
          git add crates/scirust-verify-model/src/scope.rs
          git diff --cached --check
          git commit -m "docs: clarify GPU scope identity semantics"

      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --workspace --all-targets --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --all-targets --locked
      - name: Documentation
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --locked

      - name: Remove staging and push
        run: |
          set -euo pipefail
          git rm .github/fix_v03_gpu_doc.py .github/workflows/fix-v03-gpu-doc.yml
          git commit -m "chore: remove V0.3 GPU-doc staging"
          git push origin HEAD:feat/cross-run-scope-aggregation
